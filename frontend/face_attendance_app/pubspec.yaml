publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.11.0
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  go_router: ^17.5.0
  shared_preferences: ^2.5.5
  permission_handler: ^13.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  lottie: ^3.3.0
  excel: ^4.0.6
  pdf: ^3.12.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
